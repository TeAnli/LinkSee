spring:
  application:
    name: linksee-ws

server:
  port: ${WS_PORT:9000}

logging:
  level:
    com.linksee.ws: DEBUG
    org.springframework.web: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      simple:
        enabled: true
