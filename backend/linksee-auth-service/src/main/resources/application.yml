spring:
  config:
    import: file:.env

server:
  port: 8081

spring:
  application:
    name: linksee-auth-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/linksee}
    username: ${SPRING_DATASOURCE_USERNAME:linksee}
    password: ${SPRING_DATASOURCE_PASSWORD:linksee123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

jimmer:
  dialect: org.babyfish.jimmer.sql.dialect.PostgresDialect
  show-sql: true
  pretty-print: true

jwt:
  secret: ${JWT_SECRET:dGhpcyBpcyBhIHNlY3JldCBrZXkgZm9yIGxpbmtzZWUgcHJvamVjdCBqd3QgdG9rZW4gZ2VuZXJhdGlvbg==}
  expiration-ms: 7200000
  refresh-expiration-ms: 604800000

logging:
  level:
    com.linksee: DEBUG