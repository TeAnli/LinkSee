spring:
  config:
    import: file:.env

server:
  port: 8084

spring:
  application:
    name: linksee-ai-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/linksee}
    username: ${SPRING_DATASOURCE_USERNAME:linksee}
    password: ${SPRING_DATASOURCE_PASSWORD:linksee123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  elasticsearch:
    uris: ${ELASTICSEARCH_HOSTS:http://localhost:9200}

jimmer:
  dialect: org.babyfish.jimmer.sql.dialect.PostgresDialect
  show-sql: true
  pretty-print: true

ai:
  model:
    zhipu:
      api-key: ${AI_MODEL_ZHIPU_API_KEY:}
      api-secret: ${AI_MODEL_ZHIPU_API_SECRET:}
    qwen:
      api-key: ${AI_MODEL_QIWEN_API_KEY:}
    kimi:
      api-key: ${AI_MODEL_KIMI_API_KEY:}

milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}

logging:
  level:
    com.linksee: DEBUG