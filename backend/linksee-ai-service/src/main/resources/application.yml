server:
  port: 8084

spring:
  application:
    name: linksee-ai-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/linksee}
    username: ${SPRING_DATASOURCE_USERNAME:linksee}
    password: ${SPRING_DATASOURCE_PASSWORD:linksee123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:linksee}
    password: ${RABBITMQ_PASSWORD:linksee}
  elasticsearch:
    uris: ${ELASTICSEARCH_HOSTS:http://localhost:9200}

jimmer:
  dialect: org.babyfish.jimmer.sql.dialect.PostgresDialect
  show-sql: true
  pretty-print: true

# AI Model Configuration
ai:
  model:
    zhipu:
      api-key: ${AI_MODEL_ZHIPU_API_KEY:}
      api-secret: ${AI_MODEL_ZHIPU_API_SECRET:}
    qwen:
      api-key: ${AI_MODEL_QIWEN_API_KEY:}
    kimi:
      api-key: ${AI_MODEL_KIMI_API_KEY:}

# Milvus
milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}

logging:
  level:
    com.linksee: DEBUG
