server:
  port: 8084

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: linksee-ai-service
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yaml
        shared-configs:
          - data-id: shared-spring.yaml
            refresh: false
          - data-id: shared-redis.yaml
            refresh: false
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}

jimmer:
  dialect: org.babyfish.jimmer.sql.dialect.PostgresDialect
  show-sql: true
  pretty-print: true

ai:
  model:
    zhipu:
      api-key: ${AI_MODEL_ZHIPU_API_KEY:}
      api-secret: ${AI_MODEL_ZHIPU_API_SECRET:}
    qwen:
      api-key: ${AI_MODEL_QIWEN_API_KEY:}
    kimi:
      api-key: ${AI_MODEL_KIMI_API_KEY:}

milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}

logging:
  level:
    com.linksee: DEBUG