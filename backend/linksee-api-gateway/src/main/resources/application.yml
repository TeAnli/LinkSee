server:
  port: 8080

spring:
  application:
    name: linksee-api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://linksee-auth-service
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: lb://linksee-user-service
          predicates:
            - Path=/api/user/**
        - id: forum-service
          uri: lb://linksee-forum-service
          predicates:
            - Path=/api/forum/**
        - id: ai-service
          uri: lb://linksee-ai-service
          predicates:
            - Path=/api/ai/**, /api/search/**
        - id: message-service
          uri: lb://linksee-message-service
          predicates:
            - Path=/api/message/**
      global-cors:
        cors-configurations:
          '[/**]':
            allowed-origins: "${ALLOWED_ORIGINS:http://localhost:3000}"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:linksee}
    password: ${RABBITMQ_PASSWORD:linksee}

jwt:
  secret: ${JWT_SECRET:dGhpcyBpcyBhIHNlY3JldCBrZXkgZm9yIGxpbmtzZWUgcHJvamVjdCBqd3QgdG9rZW4gZ2VuZXJhdGlvbg==}
  expiration-ms: 7200000
  refresh-expiration-ms: 604800000

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
