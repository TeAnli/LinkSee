server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: linksee-api-gateway
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yaml
        shared-configs:
          - data-id: shared-spring.yaml
            refresh: false
          - data-id: shared-redis.yaml
            refresh: false
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
    gateway:
      routes:
        - id: auth-service
          uri: lb://linksee-auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - name: Sentinel
        - id: user-service
          uri: lb://linksee-user-service
          predicates:
            - Path=/api/user/**
          filters:
            - name: Sentinel
        - id: forum-service
          uri: lb://linksee-forum-service
          predicates:
            - Path=/api/forum/**
          filters:
            - name: Sentinel
        - id: ai-service
          uri: lb://linksee-ai-service
          predicates:
            - Path=/api/ai/**, /api/search/**
          filters:
            - name: Sentinel
        - id: message-service
          uri: lb://linksee-message-service
          predicates:
            - Path=/api/message/**
          filters:
            - name: Sentinel
      global-cors:
        cors-configurations:
          '[/**]':
            allowed-origins: "${ALLOWED_ORIGINS:http://localhost:3000}"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8080}
      eager: true

jwt:
  secret: ${JWT_SECRET:dGhpcyBpcyBhIHNlY3JldCBrZXkgZm9yIGxpbmtzZWUgcHJvamVjdCBqd3QgdG9rZW4gZ2VuZXJhdGlvbg==}
  expiration-ms: ${JWT_EXPIRATION_MS:7200000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG