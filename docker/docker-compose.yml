services:
  # ============================================================
  # PostgreSQL 16 — 核心数据库
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: linksee-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: linksee
      POSTGRES_USER: linksee
      POSTGRES_PASSWORD: linksee123
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linksee"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis 7 — 缓存 / 会话 / 计数器
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: linksee-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass linksee_redis_123
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "linksee_redis_123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Elasticsearch 8.x — 全文检索（V2 阶段启用）
  # ============================================================
  elasticsearch:
    image: elasticsearch:8.16.0
    container_name: linksee-es
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    profiles:
      - full

  # ============================================================
  # RabbitMQ — 异步消息队列（V2 阶段启用）
  # ============================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: linksee-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: linksee
      RABBITMQ_DEFAULT_PASS: linksee
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    profiles:
      - full

  # ============================================================
  # backend-fastapi — Python FastAPI 主后端
  # ============================================================
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: linksee-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_NAME: LinkSee API
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://linksee:linksee123@postgres:5432/linksee
      REDIS_URL: redis://:linksee_redis_123@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-256-bits-length}
      JWT_EXPIRATION_SECONDS: "7200"
      JWT_REFRESH_EXPIRATION_SECONDS: "604800"
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE: "5242880"
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:80
      AI_MOCK_ENABLED: "true"
      ENCRYPTION_ENABLED: "true"
      RSA_KEY_DIR: /app/keys
      # SMTP (optional — set via .env)
      SMTP_HOST: ${SMTP_HOST:-smtp.qq.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      EMAIL_CODE_EXPIRE_SECONDS: "300"
      EMAIL_CODE_RATE_LIMIT_SECONDS: "60"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      # GitHub OAuth
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost/oauth/callback}
    volumes:
      - uploads-data:/app/uploads
      - keys-data:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================
  # ws-server — Kotlin WebSocket 实时通信服务
  # ============================================================
  ws-server:
    build:
      context: ..
      dockerfile: docker/ws-server.Dockerfile
    container_name: linksee-ws
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      WS_PORT: "9000"
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================
  # web — React 前端 (Nginx 静态托管)
  # ============================================================
  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    container_name: linksee-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - ws-server

volumes:
  postgres-data:
  redis-data:
  es-data:
  rabbitmq-data:
  uploads-data:
  keys-data:
